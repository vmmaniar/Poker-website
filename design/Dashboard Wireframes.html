<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poker Tracker — Dashboard Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&family=Kalam:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #444;
    --ink-faint: #888;
    --paper: #f6f1e6;
    --paper-2: #efe8d6;
    --line: #2a2a2a;
    --felt: #2f7d4f;     /* poker-table green accent */
    --chip-red: #c8463a;
    --chip-blue: #2f5fa8;
    --hand: 'Patrick Hand', 'Kalam', cursive;
    --script: 'Caveat', cursive;
    --mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--hand);
    font-size: 16px;
    min-height: 100vh;
    /* paper grain */
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.025) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 50%);
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 48px 32px 120px;
  }

  .page-header {
    border-bottom: 2px dashed var(--ink);
    padding-bottom: 28px;
    margin-bottom: 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
  }
  .page-header .title-block { display: flex; flex-direction: column; gap: 10px; }
  .page-header h1 {
    font-family: var(--script);
    font-weight: 700;
    font-size: 52px;
    margin: 0 0 8px;
    line-height: 1.1;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .page-header .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .page-header .meta b { color: var(--felt); }
  .scribble {
    font-family: var(--script);
    color: var(--felt);
    font-size: 22px;
    transform: rotate(-2deg);
    display: inline-block;
  }

  .legend {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 32px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  .screen-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin-bottom: 28px;
    border-bottom: 2px dashed var(--ink);
  }
  .screen-nav button {
    appearance: none;
    border: 1.5px solid var(--ink);
    border-bottom: none;
    background: #faf6ec;
    font-family: var(--hand);
    font-size: 17px;
    color: var(--ink-soft);
    padding: 10px 18px 12px;
    cursor: pointer;
    border-radius: 12px 12px 0 0;
    margin-right: 6px;
    margin-bottom: -2px;
    transform: rotate(-0.4deg);
  }
  .screen-nav button:nth-child(2n) { transform: rotate(0.3deg); }
  .screen-nav button.active {
    background: var(--felt);
    color: #fdfaef;
    border-color: #1f5634;
    font-weight: 700;
  }
  .legend span::before {
    content: "■";
    margin-right: 6px;
  }
  .legend .l-felt::before { color: var(--felt); }
  .legend .l-red::before  { color: var(--chip-red); }
  .legend .l-blue::before { color: var(--chip-blue); }
  .legend .l-ink::before  { color: var(--ink); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 56px 40px;
    align-items: start;
    justify-items: center;
  }

  /* ---- direction card (label + phone) ---- */
  .dir {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .dir-label {
    text-align: center;
    max-width: 320px;
  }
  .dir-label .num {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--felt);
    text-transform: uppercase;
  }
  .dir-label .name {
    font-family: var(--script);
    font-size: 36px;
    line-height: 1;
    margin: 4px 0 6px;
    color: var(--ink);
  }
  .dir-label .desc {
    font-family: var(--hand);
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.3;
  }

  /* ---- phone frame ---- */
  .phone {
    width: 340px;
    height: 760px;
    border: 2.5px solid var(--line);
    border-radius: 42px;
    background: #fff;
    background-image:
      linear-gradient(rgba(0,0,0,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.012) 1px, transparent 1px);
    background-size: 16px 16px;
    padding: 14px 10px 16px;
    box-shadow:
      3px 4px 0 rgba(0,0,0,0.08),
      6px 8px 0 rgba(0,0,0,0.04);
    position: relative;
    /* slight wonky tilt – sketchy */
    transform: rotate(-0.4deg);
    flex: 0 0 auto;
  }
  .dir:nth-child(2n) .phone { transform: rotate(0.5deg); }
  .dir:nth-child(3n) .phone { transform: rotate(-0.2deg); }

  .phone .notch {
    width: 90px; height: 18px;
    background: var(--line);
    border-radius: 0 0 14px 14px;
    margin: 0 auto 8px;
  }
  .screen {
    width: 100%;
    height: calc(100% - 26px);
    border: 1.5px dashed rgba(0,0,0,0.18);
    border-radius: 26px;
    overflow: hidden;
    padding: 14px 14px 0;
    display: flex;
    flex-direction: column;
    gap: 9px;
    position: relative;
    min-height: 0;
  }
  .screen > * { flex-shrink: 0; }
  .nowrap { white-space: nowrap; }

  /* sketchy primitives */
  .h-hand { font-family: var(--hand); }
  .h-script { font-family: var(--script); }
  .h-mono { font-family: var(--mono); font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-soft); }

  .sk-box {
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 8px 10px;
    background: #fff;
  }
  .sk-box.dashed { border-style: dashed; }
  .sk-box.felt { background: var(--felt); color: #fdfaef; border-color: #1f5634; }
  .sk-box.dim { background: #faf6ec; }
  .sk-row { display: flex; align-items: center; gap: 8px; }
  .sk-row.between { justify-content: space-between; }

  .sk-line {
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 9px);
    border-radius: 3px;
    opacity: 0.55;
  }
  .sk-line.short { width: 60%; }
  .sk-line.mid   { width: 80%; }
  .sk-line.tiny  { width: 30%; height: 4px; opacity: 0.4;}

  .sk-pill {
    border: 1.3px solid var(--ink);
    border-radius: 999px;
    padding: 3px 10px;
    font-family: var(--hand);
    font-size: 13px;
    background: #fff;
    white-space: nowrap;
  }
  .sk-pill.felt { background: var(--felt); color: #fdfaef; border-color: #1f5634; }
  .sk-pill.red  { background: var(--chip-red); color: #fff; border-color: #8c2d24; }
  .sk-pill.ghost { background: transparent; border-style: dashed; color: var(--ink-soft); }

  .sk-avatar {
    width: 28px; height: 28px;
    border: 1.3px solid var(--ink);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--script);
    font-size: 16px;
    background: #fff;
    flex: 0 0 auto;
  }
  .sk-avatar.lg { width: 44px; height: 44px; font-size: 22px; }
  .sk-avatar.sm { width: 22px; height: 22px; font-size: 13px; }

  .sk-chip {
    width: 18px; height: 18px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    background:
      repeating-conic-gradient(from 0deg, var(--chip-red) 0 30deg, #fff 30deg 60deg);
    flex: 0 0 auto;
  }
  .sk-chip.blue { background: repeating-conic-gradient(from 0deg, var(--chip-blue) 0 30deg, #fff 30deg 60deg); }
  .sk-chip.felt { background: repeating-conic-gradient(from 0deg, var(--felt) 0 30deg, #fff 30deg 60deg); }
  .sk-chip.lg { width: 28px; height: 28px; }

  .num-big {
    font-family: var(--script);
    font-size: 30px;
    line-height: 1;
    font-weight: 700;
  }
  .num-pos { color: var(--felt); }
  .num-neg { color: var(--chip-red); }

  /* sketchy chart */
  .sk-chart {
    height: 78px;
    border-bottom: 1.5px solid var(--ink);
    border-left: 1.5px solid var(--ink);
    position: relative;
    padding: 6px 4px 0;
  }
  .sk-chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sk-chart .axis-tick {
    position: absolute;
    bottom: -14px;
    font-family: var(--mono);
    font-size: 8px;
    color: var(--ink-faint);
    transform: translateX(-50%);
  }

  .sk-bar-row { display: flex; align-items: end; gap: 6px; height: 72px; }
  .sk-bar {
    flex: 1;
    border: 1.3px solid var(--ink);
    border-radius: 4px 4px 0 0;
    background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,0.07) 4px 5px);
    position: relative;
  }
  .sk-bar.felt { background: var(--felt); }
  .sk-bar.red { background: var(--chip-red); }

  .sk-tabs {
    display: flex;
    border-bottom: 1.5px solid var(--ink);
    gap: 0;
    margin-top: auto;
    margin-left: -14px;
    margin-right: -14px;
  }
  .sk-tabs .tab {
    flex: 1;
    text-align: center;
    padding: 6px 0 8px;
    font-family: var(--hand);
    font-size: 12px;
    color: var(--ink-faint);
    border-top: 1.5px solid var(--ink);
    border-right: 1.5px solid var(--ink);
    background: #faf6ec;
  }
  .sk-tabs .tab:last-child { border-right: none; }
  .sk-tabs .tab.active {
    background: var(--felt);
    color: #fdfaef;
    font-weight: 700;
  }

  .sk-card-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .arrow-note {
    font-family: var(--script);
    color: var(--felt);
    font-size: 16px;
    transform: rotate(-3deg);
    display: inline-block;
  }

  .footer-notes {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 2px dashed var(--ink);
    font-family: var(--hand);
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.5;
    max-width: 720px;
  }
  .footer-notes b { color: var(--felt); font-family: var(--script); font-size: 22px; }
  .footer-notes ul { padding-left: 22px; margin: 8px 0 0; }
  .footer-notes li { margin: 4px 0; }

  /* highlight when tweak active */
  .show-annotations .annot { display: block !important; }
  .annot {
    display: none;
    position: absolute;
    font-family: var(--script);
    color: var(--felt);
    font-size: 16px;
    pointer-events: none;
    z-index: 5;
    line-height: 1.05;
    transform: rotate(-4deg);
  }
  .annot::before {
    content: "↳ ";
  }
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div class="title-block">
      <h1>Poker Night Wireframes</h1>
      <div class="scribble" id="screen-scribble">~ home screen, 4 directions ~</div>
    </div>
    <div class="meta">
      Phone-first &nbsp;·&nbsp; Cash games &nbsp;·&nbsp; <b>5–8 regulars</b> &nbsp;·&nbsp; Wireframe v2
    </div>
  </header>

  <nav id="screen-nav" class="screen-nav"></nav>

  <div class="legend">
    <span class="l-ink">structure / outline</span>
    <span class="l-felt">primary action / win</span>
    <span class="l-red">loss / alert</span>
    <span class="l-blue">secondary data</span>
  </div>

  <div id="root"></div>

  <div class="footer-notes" id="footer-notes"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="wireframes.jsx"></script>
</body>
</html>
